name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, feature/minha-branch-v2 ]   # rode quando fizer push na main
    # se quiser testar numa feature, adicione:
    # branches: [ main, feature/minha-branch-v2 ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html     # SPA fallback
      - run: touch dist/.nojekyll                 # desabilita Jekyll
      - uses: actions/upload-pages-artifact@v3    # publica o dist/
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
